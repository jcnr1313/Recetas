<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Revisiones OCA</title>
    <!-- Tailwind CSS para un diseño limpio y moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 sm:p-6">

    <div class="max-w-5xl mx-auto">
        <!-- Cabecera -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-slate-900">Gestión de Inspecciones OCA</h1>
            <p class="text-slate-600 text-sm mt-1">Control de direcciones, responsables y plazos de caducidad</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Formulario de Registro -->
            <div class="bg-white p-6 rounded-xl shadow-md lg:col-span-1 h-fit">
                <h2 class="text-xl font-semibold mb-4 text-slate-700 border-b pb-2">Nueva Inspección</h2>
                <form id="ocaForm" class="space-y-4">
                    
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Dirección / Instalación</label>
                        <input type="text" id="direccion" required 
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="Ej. Calle Mayor 12, Valencia">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Realizado por</label>
                        <select id="realizadoPor" required
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">Selecciona un responsable...</option>
                            <option value="Autónomo">Autónomo</option>
                            <option value="Técnico de empresa">Técnico de empresa</option>
                            <option value="Servicio Oficial / Organismo">Servicio Oficial / Organismo</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Fecha de Realización</label>
                        <input type="date" id="fechaRealizacion" required 
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Fecha de Caducidad</label>
                        <input type="date" id="fechaCaducidad" required 
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Observaciones / Notas</label>
                        <textarea id="observaciones" rows="2" 
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="Detalles adicionales, defectos leves..."></textarea>
                    </div>

                    <button type="submit" 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors shadow">
                        Guardar Registro
                    </button>
                </form>
            </div>

            <!-- Listado y Filtros -->
            <div class="bg-white p-6 rounded-xl shadow-md lg:col-span-2">
                <div class="flex flex-col sm:flex-row justify-between items-center mb-4 gap-3 border-b pb-2">
                    <h2 class="text-xl font-semibold text-slate-700">Listado de Registros</h2>
                    <div class="flex gap-2 w-full sm:w-auto">
                        <input type="text" id="buscador" placeholder="Buscar dirección..." 
                            class="px-3 py-1.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 w-full sm:w-48">
                        <button onclick="exportarCSV()" 
                            class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm px-3 py-1.5 rounded-lg transition-colors whitespace-nowrap">
                            Exportar CSV
                        </button>
                    </div>
                </div>

                <!-- Tabla de datos -->
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 text-slate-600 text-xs uppercase tracking-wider border-b">
                                <th class="p-3">Dirección / Responsable</th>
                                <th class="p-3">Fechas</th>
                                <th class="p-3">Estado</th>
                                <th class="p-3 text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaOcas" class="divide-y divide-slate-200 text-sm">
                            <!-- Los registros se cargan dinámicamente aquí -->
                        </tbody>
                    </table>
                </div>
                <div id="sinRegistros" class="text-center py-8 text-slate-400 hidden">
                    No hay registros guardados actualmente.
                </div>
            </div>

        </div>
    </div>

    <!-- Lógica de la Aplicación -->
    <script>
        let registros = JSON.parse(localStorage.getItem('registros_oca')) || [];

        const form = document.getElementById('ocaForm');
        const tablaOcas = document.getElementById('tablaOcas');
        const sinRegistros = document.getElementById('sinRegistros');
        const buscador = document.getElementById('buscador');

        // Autocompletar fecha de realización con el día de hoy por comodidad
        document.getElementById('fechaRealizacion').valueAsDate = new Date();

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const nuevoRegistro = {
                id: Date.now(),
                direccion: document.getElementById('direccion').value,
                realizadoPor: document.getElementById('realizadoPor').value,
                fechaRealizacion: document.getElementById('fechaRealizacion').value,
                fechaCaducidad: document.getElementById('fechaCaducidad').value,
                observaciones: document.getElementById('observaciones').value
            };

            registros.push(nuevoRegistro);
            guardarYRenderizar();
            form.reset();
            document.getElementById('fechaRealizacion').valueAsDate = new Date();
        });

        function guardarYRenderizar() {
            localStorage.setItem('registros_oca', JSON.stringify(registros));
            renderizarTabla(registros);
        }

        function calcularEstado(fechaCaducidadStr) {
            const hoy = new Date();
            hoy.setHours(0,0,0,0);
            const caducidad = new Date(fechaCaducidadStr);
            caducidad.setHours(0,0,0,0);

            const diferenciaDias = Math.ceil((caducidad - hoy) / (1000 * 60 * 60 * 24));

            if (diferenciaDias < 0) {
                return { texto: 'Caducado', clase: 'bg-red-100 text-red-700 border-red-200' };
            } else if (diferenciaDias <= 30) {
                return { texto: `Próximo (${diferenciaDias} días)`, clase: 'bg-amber-100 text-amber-700 border-amber-200' };
            } else {
                return { texto: 'Vigente', clase: 'bg-emerald-100 text-emerald-700 border-emerald-200' };
            }
        }

        function renderizarTabla(datos) {
            tablaOcas.innerHTML = '';

            if (datos.length === 0) {
                sinRegistros.classList.remove('hidden');
                return;
            } else {
                sinRegistros.classList.add('hidden');
            }

            datos.forEach(reg => {
                const estado = calcularEstado(reg.fechaCaducidad);
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition-colors";

                tr.innerHTML = `
                    <td class="p-3">
                        <div class="font-semibold text-slate-800">${reg.direccion}</div>
                        <div class="text-xs text-slate-500">Por: <span class="font-medium text-slate-600">${reg.realizadoPor}</span></div>
                        ${reg.observaciones ? `<div class="text-xs text-slate-400 mt-1 italic">"${reg.observaciones}"</div>` : ''}
                    </td>
                    <td class="p-3 text-xs text-slate-600">
                        <div><span class="font-medium">Realizada:</span> ${reg.fechaRealizacion}</div>
                        <div><span class="font-medium">Caduca:</span> ${reg.fechaCaducidad}</div>
                    </td>
                    <td class="p-3">
                        <span class="px-2.5 py-1 text-xs font-semibold rounded-full border ${estado.clase}">
                            ${estado.texto}
                        </span>
                    </td>
                    <td class="p-3 text-center">
                        <button onclick="eliminarRegistro(${reg.id})" class="text-slate-400 hover:text-red-600 p-1 transition-colors" title="Eliminar">
                            🗑️
                        </button>
                    </td>
                `;
                tablaOcas.appendChild(tr);
            });
        }

        function eliminarRegistro(id) {
            if (confirm('¿Estás seguro de que deseas eliminar este registro?')) {
                registros = registros.filter(r => r.id !== id);
                guardarYRenderizar();
            }
        }

        buscador.addEventListener('input', function(e) {
            const textoBusqueda = e.target.value.toLowerCase();
            const filtrados = registros.filter(r => 
                r.direccion.toLowerCase().includes(textoBusqueda) || 
                r.realizadoPor.toLowerCase().includes(textoBusqueda)
            );
            renderizarTabla(filtrados);
        });

        function exportarCSV() {
            if (registros.length === 0) {
                alert('No hay datos para exportar.');
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,Direccion,RealizadoPor,FechaRealizacion,FechaCaducidad,Observaciones\n";
            registros.forEach(r => {
                csvContent += `"${r.direccion}","${r.realizadoPor}","${r.fechaRealizacion}","${r.fechaCaducidad}","${r.observaciones}"\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "control_ocas.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Carga inicial al abrir la página
        renderizarTabla(registros);
    </script>
</body>
</html>
