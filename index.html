<!DOCTYPE html>
<html lang="es" data-theme="stark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCAS • Command Center V6</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-app: #020617; --bg-card: rgba(15, 23, 42, 0.85); --text-main: #f8fafc; --text-muted: #94a3b8;
            --border: rgba(51, 65, 85, 0.8); --accent: #06b6d4; --accent-glow: rgba(6, 182, 212, 0.4);
            --radius-lg: 20px; --radius-md: 12px;
            --shadow: 0 20px 25px -5px rgba(0,0,0,0.6), 0 8px 10px -6px rgba(0,0,0,0.6);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        [data-theme="cyberpunk"] {
            --bg-app: #090014; --bg-card: rgba(24, 0, 46, 0.85); --text-main: #fff5fd; --text-muted: #d946ef;
            --border: rgba(217, 70, 239, 0.4); --accent: #ec4899; --accent-glow: rgba(236, 72, 153, 0.6);
        }
        [data-theme="matrix"] {
            --bg-app: #020d04; --bg-card: rgba(3, 26, 8, 0.85); --text-main: #f0fdf4; --text-muted: #4ade80;
            --border: rgba(74, 222, 128, 0.4); --accent: #22c55e; --accent-glow: rgba(34, 197, 94, 0.6);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-app); color: var(--text-main); padding: 20px; min-height: 100vh; position: relative; overflow-x: hidden; }
        body::before { content: ''; position: fixed; inset: 0; background-image: radial-gradient(circle at 50% 50%, var(--accent-glow) 0%, transparent 60%); opacity: 0.15; pointer-events: none; z-index: -1; }

        .font-mono-custom { font-family: 'JetBrains Mono', monospace; }
        .main-container { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        
        header { background: var(--bg-card); backdrop-filter: blur(16px); padding: 18px 24px; border-radius: var(--radius-lg); box-shadow: var(--shadow); display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); flex-wrap: wrap; gap: 15px; }
        header h1 { font-size: 1.3rem; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 12px; }
        .header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        
        .btn { padding: 9px 14px; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; border: none; transition: var(--transition); font-size: 0.82rem; display: flex; align-items: center; gap: 8px; text-decoration: none;}
        .btn-primary { background: var(--accent); color: white; box-shadow: 0 0 15px var(--accent-glow); }
        .btn-primary:hover { filter: brightness(1.2); transform: translateY(-1px); }
        .btn-secondary { background: rgba(30, 41, 59, 0.6); border: 1px solid var(--border); color: var(--text-main); backdrop-filter: blur(8px); }
        .btn-secondary:hover { background: rgba(51, 65, 85, 0.8); border-color: var(--accent); }
        
        .app-logo { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; border: 1px solid var(--accent); box-shadow: 0 0 10px var(--accent-glow); }

        .network-status-badge { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-family: 'JetBrains Mono', monospace; }
        .net-dot { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }
        .net-dot.online { background: #22c55e; color: #22c55e; }

        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        
        .card { background: var(--bg-card); backdrop-filter: blur(16px); border-radius: var(--radius-lg); padding: 22px; box-shadow: var(--shadow); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; transition: var(--transition); text-decoration: none; color: inherit; position: relative; overflow: hidden; }
        .card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 0 25px var(--accent-glow); }
        
        .card-icon { width: 48px; height: 48px; border-radius: 12px; background: var(--accent-glow); border: 1px solid var(--accent); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; color: var(--accent); margin-bottom: 4px; }
        .card h2 { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
        .card p { font-size: 0.82rem; color: var(--text-muted); line-height: 1.4; }
        
        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); font-size: 0.75rem; font-family: 'JetBrains Mono', monospace; color: var(--accent); }

        #toast { position: fixed; bottom: 20px; right: 20px; background: var(--bg-card); border: 1px solid var(--accent); color: var(--text-main); padding: 10px 18px; border-radius: var(--radius-md); font-weight: 600; font-size: 0.82rem; z-index: 4000; transform: translateY(100px); opacity: 0; transition: all 0.3s; }
        #toast.show { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <div class="main-container">
        <header>
            <div style="display: flex; align-items: center; gap: 12px;">
                <img src="logo.jpeg" alt="Logo" class="app-logo" onerror="this.style.display='none'">
                <h1>⚡ OCAS Command Center <span style="font-size: 0.65rem; padding: 2px 8px; background: var(--accent-glow); border: 1px solid var(--accent); border-radius: 20px; color: var(--accent);" class="font-mono-custom">V6</span></h1>
            </div>
            <div class="header-actions">
                <div class="network-status-badge">
                    <span class="net-dot online"></span>
                    <span class="font-mono-custom">Sistema Activo</span>
                </div>
                <select id="theme-selector" onchange="cambiarTemaHUD(this.value)" class="config-input btn-secondary" style="padding: 7px 10px; font-weight: 600; border-radius: var(--radius-md); border: 1px solid var(--border); background: rgba(30,41,59,0.6); color: var(--text-main);">
                    <option value="stark">Stark (Cian)</option>
                    <option value="cyberpunk">Cyberpunk</option>
                    <option value="matrix">Matrix (Verde)</option>
                </select>
            </div>
        </header>

        <div class="dashboard-grid">
            <a href="guardias.html" class="card">
                <div class="card-icon"><i class="fa-solid fa-shield-halved"></i></div>
                <h2>Cuadrante de Guardias</h2>
                <p>Gestión de turnos, rotaciones equitativas, tarifas operativas y calendario táctico de técnicos.</p>
                <div class="card-footer">
                    <span>Abrir Módulo</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </div>
            </a>

            <div class="card" style="opacity: 0.6; border-style: dashed;">
                <div class="card-icon" style="background: rgba(255,255,255,0.05); border-color: var(--border); color: var(--text-muted);"><i class="fa-solid fa-server"></i></div>
                <h2>Servidor Docker / CasaOS</h2>
                <p>Panel de control para contenedores y servicios en red local.</p>
                <div class="card-footer" style="color: var(--text-muted);">
                    <span>Próximamente</span>
                </div>
            </div>
        </div>
    </div>

    <div id="toast">Operación completada</div>

    <script>
        function cambiarTemaHUD(tema) {
            document.documentElement.setAttribute('data-theme', tema);
            showToast(`🎨 Tema cambiado a ${tema.toUpperCase()}`);
        }

        function showToast(msg) {
            const t = document.getElementById('toast'); 
            t.innerText = msg; 
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
